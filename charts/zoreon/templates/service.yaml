apiVersion: v1
kind: Service
metadata:
  name: {{ include "zoreon.fullname" . }}
  labels:
    {{- include "zoreon.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "zoreon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
