{{- if and .Values.secret.create (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zoreon.secretName" . }}
  labels:
    {{- include "zoreon.labels" . | nindent 4 }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ .Values.secret.BETTER_AUTH_SECRET | quote }}
  DATABASE_URL: {{ include "zoreon.databaseUrl" . | quote }}
  MATTERMOST_TOKEN: {{ .Values.secret.MATTERMOST_TOKEN | default "" | quote }}
  SMTP_USER: {{ .Values.secret.SMTP_USER | default "" | quote }}
  SMTP_PASS: {{ .Values.secret.SMTP_PASS | default "" | quote }}
  VAPID_PUBLIC_KEY: {{ .Values.secret.VAPID_PUBLIC_KEY | default "" | quote }}
  VAPID_PRIVATE_KEY: {{ .Values.secret.VAPID_PRIVATE_KEY | default "" | quote }}
{{- end }}
